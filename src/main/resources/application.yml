server:
  port: ${PORT:8080}
  # À l'arrêt, le serveur termine les requêtes en cours avant de s'éteindre
  shutdown: graceful

spring:
  application:
    name: employee-api
  lifecycle:
    # Temps maximum laissé aux requêtes en cours pour se terminer
    timeout-per-shutdown-phase: 8s
  data:
    mongodb:
      uri: ${DB_URI:mongodb://127.0.0.1:27017/bd_name}
      # Crée les index au démarrage (email unique)
      auto-index-creation: true

app:
  security:
    bcrypt-strength: ${SALT_ROUNDS:10}
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:1d}
