services:
  api:
    build: .
    image: employee-api-spring:latest
    # Réglages de l'application (fichier à créer à partir de .env.example)
    env_file: .production.env
    environment:
      # Adresse de la base lancée ci-dessous
      DB_URI: mongodb://mongo:27017/bd_name
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Lance tous les tests : docker compose run --rm integration-tests
  integration-tests:
    profiles: ["test"]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    command: mvn -B -ntp verify
    environment:
      # Permet aux tests de joindre le MongoDB temporaire qu'ils démarrent
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - .:/app
      - maven-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mongo-data:
  maven-cache:
